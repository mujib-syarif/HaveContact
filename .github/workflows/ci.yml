name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Dependency audit report
        continue-on-error: true
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); for (const [name,v] of Object.entries(a.vulnerabilities ?? {})) console.log(JSON.stringify({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==="string"?x:{title:x.title,url:x.url,range:x.range})}))'
      - run: npm run typecheck
      - run: npm run typecheck:worker
      - run: npm test
      - name: Validate D1 migrations locally
        run: |
          sed 's/REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID/00000000-0000-0000-0000-000000000000/' wrangler.toml > wrangler.ci.toml
          npx wrangler d1 migrations apply havecontact-db --local --config wrangler.ci.toml
          rm -f wrangler.ci.toml
      - name: Validate production Worker deployment bundle
        run: |
          sed 's/REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID/00000000-0000-0000-0000-000000000000/g' wrangler.toml > wrangler.ci.toml
          npx wrangler deploy --dry-run --config wrangler.ci.toml --env production --outdir .wrangler/deploy
          rm -f wrangler.ci.toml
      - run: npm run build
