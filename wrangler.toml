name = "havecontact-api"
main = "worker/index.ts"
compatibility_date = "2026-11-01"

[vars]
APP_ENV = "development"

[[d1_databases]]
binding = "DB"
database_name = "havecontact-db"
database_id = "05732a49-f53f-43a3-9a8c-467fa4a3295d"
migrations_dir = "migrations"

# Configure secrets with:
# npx wrangler secret put PHONE_HASH_SECRET
# npx wrangler secret put TURNSTILE_SECRET
# npx wrangler secret put ADMIN_API_TOKEN

[triggers]
crons = ["17 3 * * *"]

# Explicit production environment, bound to the provisioned HaveContact D1 database.
[env.production]
workers_dev = true

[env.production.vars]
APP_ENV = "production"

[[env.production.d1_databases]]
binding = "DB"
database_name = "havecontact-db"
database_id = "05732a49-f53f-43a3-9a8c-467fa4a3295d"
migrations_dir = "migrations"
